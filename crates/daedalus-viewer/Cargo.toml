[package]
name = "daedalus-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
daedalus-core.workspace = true
daedalus-io.workspace = true
daedalus-sheet.workspace = true
daedalus-fea.workspace = true
wgpu = "24"
winit = "0.30"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
egui = "0.31.1"
egui-winit = "0.31.1"
egui-wgpu = "0.31.1"
# 3D Text: glyph outlines (ttf-parser, MIT/Apache) from the Ubuntu Light font egui already ships (Ubuntu Font Licence).
ttf-parser = "0.25"
# textures: images read and resized (same crate and version daedalus-io uses)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
epaint_default_fonts = "0.31.1"

# Light or dark from the desktop (the XDG desktop portal's color-scheme), followed live. Windows reports it through winit.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The shaders are compiled and validated in a test, without a GPU (the same naga wgpu 24 uses).
[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
