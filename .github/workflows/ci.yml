name: CI

on:
  push:
  pull_request:

# a newer push makes the run for an older one moot
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install toolchain
        run: pacman -Syu --noconfirm base-devel git rust
      - uses: actions/checkout@v4
      # the exact-solid kernel (daedalus-sheet) is most of the build: keep compiled dependencies between runs
      - uses: Swatinem/rust-cache@v2
      # formatting (rustfmt.toml) and lints: the debt cleared on 2026-11-11 must not come back
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --locked
      - name: Test
        run: cargo test --workspace --locked
